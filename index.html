<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modulador de Voz</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #7c5cff;
    --accent2: #ff5c8a;
    --text: #eaeaf0;
    --muted: #8b8fa3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1c2030 0%, var(--bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

  #toggleBtn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: white;
    transition: transform 0.1s ease, background 0.2s ease;
    margin-bottom: 22px;
  }
  #toggleBtn:active { transform: scale(0.97); }
  #toggleBtn.active { background: var(--accent2); }

  .presets {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .presets button {
    flex: 1;
    padding: 12px 8px;
    border-radius: 12px;
    border: 1px solid #2a2f3d;
    background: #1e2230;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .presets button:hover { border-color: var(--accent); }
  .presets button.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .slider-row { margin-bottom: 10px; }
  .slider-row label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .output-row { margin-bottom: 10px; text-align: left; }
  .output-row label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #2a2f3d;
    background: #1e2230;
    color: var(--text);
    font-size: 14px;
  }

  #status {
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  #status.on { color: #6ee787; }

  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🎙️ Modulador de Voz</h1>
    <p class="sub">Cambia tu voz en tiempo real: grave o aguda</p>

    <button id="toggleBtn">Activar micrófono</button>

    <div class="presets">
      <button data-pitch="-7" id="btnGrave">Voz Grave</button>
      <button data-pitch="0" id="btnNormal" class="selected">Normal</button>
      <button data-pitch="12" id="btnAguda">Voz Aguda</button>
    </div>

    <div class="slider-row">
      <label>
        <span>Ajuste fino</span>
        <span id="pitchValue">0</span>
      </label>
      <input type="range" id="slider" min="-12" max="12" step="1" value="0" />
    </div>

    <div class="output-row">
      <label for="outputSelect">Salida de audio</label>
      <select id="outputSelect">
        <option value="">Predeterminada</option>
      </select>
    </div>

    <div id="status">Micrófono apagado</div>
    <div class="hint">Usa auriculares para evitar el eco/retroalimentación.</div>
  </div>

  <audio id="outputAudio" autoplay playsinline></audio>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script>
  let micStream = null;
  let micSourceNode = null;
  let pitchShift = null;
  let eq = null;
  let limiter = null;
  let started = false;

  const toggleBtn = document.getElementById('toggleBtn');
  const statusEl = document.getElementById('status');
  const slider = document.getElementById('slider');
  const pitchValue = document.getElementById('pitchValue');
  const presetButtons = [
    document.getElementById('btnGrave'),
    document.getElementById('btnNormal'),
    document.getElementById('btnAguda'),
  ];
  const outputSelect = document.getElementById('outputSelect');
  const outputAudio = document.getElementById('outputAudio');
  let mediaStreamDest = null;

  async function refreshOutputDevices() {
    if (!navigator.mediaDevices?.enumerateDevices) return;
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const outputs = devices.filter(d => d.kind === 'audiooutput');
      const current = outputSelect.value;
      outputSelect.innerHTML = '<option value="">Predeterminada</option>';
      outputs.forEach((d, i) => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Dispositivo ${i + 1}`;
        outputSelect.appendChild(opt);
      });
      if (outputs.some(d => d.deviceId === current)) outputSelect.value = current;
    } catch (err) {
      console.warn('No se pudieron listar los dispositivos de salida', err);
    }
  }

  async function applyOutputDevice(deviceId) {
    if (typeof outputAudio.setSinkId !== 'function') return; // no soportado (ej. Safari/Firefox)
    try {
      await outputAudio.setSinkId(deviceId || '');
    } catch (err) {
      console.warn('No se pudo cambiar la salida de audio', err);
    }
  }

  outputSelect.addEventListener('change', () => applyOutputDevice(outputSelect.value));

  async function startMic() {
    await Tone.start();

    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: false,
      }
    });

    pitchShift = new Tone.PitchShift({ pitch: Number(slider.value), windowSize: 0.12 });
    eq = new Tone.EQ3({ low: -2, mid: 2, high: 3 });
    limiter = new Tone.Limiter(-3);

    mediaStreamDest = Tone.getContext().rawContext.createMediaStreamDestination();
    limiter.connect(mediaStreamDest);
    outputAudio.srcObject = mediaStreamDest.stream;
    await outputAudio.play().catch(() => {});

    micSourceNode = Tone.getContext().rawContext.createMediaStreamSource(micStream);
    Tone.connect(micSourceNode, pitchShift);
    pitchShift.connect(eq);
    eq.connect(limiter);

    await refreshOutputDevices();
    if (outputSelect.value) await applyOutputDevice(outputSelect.value);
  }

  function stopMic() {
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    micSourceNode = null;
    if (pitchShift) { pitchShift.dispose(); pitchShift = null; }
    if (eq) { eq.dispose(); eq = null; }
    if (limiter) { limiter.dispose(); limiter = null; }
    outputAudio.srcObject = null;
    mediaStreamDest = null;
  }

  toggleBtn.addEventListener('click', async () => {
    try {
      if (!started) {
        toggleBtn.disabled = true;
        toggleBtn.textContent = 'Activando...';
        await startMic();
        started = true;
        toggleBtn.textContent = 'Detener micrófono';
        toggleBtn.classList.add('active');
        statusEl.textContent = 'Micrófono activo';
        statusEl.classList.add('on');
      } else {
        stopMic();
        started = false;
        toggleBtn.textContent = 'Activar micrófono';
        toggleBtn.classList.remove('active');
        statusEl.textContent = 'Micrófono apagado';
        statusEl.classList.remove('on');
      }
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Error: no se pudo acceder al micrófono';
      toggleBtn.textContent = 'Activar micrófono';
    } finally {
      toggleBtn.disabled = false;
    }
  });

  let pitchDebounce = null;

  function setPitch(semitones, { immediate = true } = {}) {
    slider.value = semitones;
    pitchValue.textContent = semitones;
    presetButtons.forEach(btn => {
      btn.classList.toggle('selected', Number(btn.dataset.pitch) === Number(semitones));
    });

    if (!pitchShift) return;

    if (immediate) {
      pitchShift.pitch = semitones;
    } else {
      clearTimeout(pitchDebounce);
      pitchDebounce = setTimeout(() => { pitchShift.pitch = semitones; }, 80);
    }
  }

  slider.addEventListener('input', (e) => setPitch(Number(e.target.value), { immediate: false }));
  presetButtons.forEach(btn => {
    btn.addEventListener('click', () => setPitch(Number(btn.dataset.pitch)));
  });
</script>
</body>
</html>
